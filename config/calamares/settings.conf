# ==============================================================================
# Akriti OS - Calamares Installer Configuration
# Tailored for Bharat Cyberdeck / Akriti Chameleon Architecture
# ==============================================================================
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules, /usr/lib/calamares/modules ]

instances:
  - id:       root
    module:   unpackfs
    config:   unpackfs.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs@root
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - akriti-postinstall
      - umount
  - show:
      - finished

branding: akriti
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
