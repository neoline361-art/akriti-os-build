<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="50%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#07090F"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E27D60"/>
      <stop offset="100%" stop-color="#FF8A50"/>
    </linearGradient>
    <linearGradient id="peacockGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#02C39A"/>
    </linearGradient>
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#283149" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="0" cy="0" r="1.5" fill="#E27D60" fill-opacity="0.25"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#cyberGrid)"/>

  <!-- Geometric Yantra Mandala Centerpiece -->
  <g transform="translate(960, 540)">
    <!-- Outer Rings -->
    <circle r="360" fill="none" stroke="#283149" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>
    <circle r="320" fill="none" stroke="url(#peacockGrad)" stroke-width="2" opacity="0.5"/>
    <circle r="280" fill="none" stroke="#1F2338" stroke-width="12" opacity="0.6"/>

    <!-- Sacred Triangles (Yantra Interlocking Matrix) -->
    <!-- Downward Triangle (Shakti) -->
    <polygon points="0,240 207.8,-120 -207.8,-120" fill="none" stroke="url(#copperGrad)" stroke-width="2.5" opacity="0.75" filter="url(#glow)"/>
    <!-- Upward Triangle (Shiva) -->
    <polygon points="0,-240 207.8,120 -207.8,120" fill="none" stroke="url(#peacockGrad)" stroke-width="2.5" opacity="0.75" filter="url(#glow)"/>

    <!-- Inner Core Hexagram & Concentric Sanctum -->
    <circle r="140" fill="none" stroke="#E27D60" stroke-width="1.5" stroke-opacity="0.8"/>
    <polygon points="0,120 103.9,-60 -103.9,-60" fill="none" stroke="#00A896" stroke-width="1.5" opacity="0.6"/>
    <polygon points="0,-120 103.9,60 -103.9,60" fill="none" stroke="#E27D60" stroke-width="1.5" opacity="0.6"/>

    <!-- Bindu Central Nexus -->
    <circle r="24" fill="#0B0E17" stroke="url(#copperGrad)" stroke-width="2"/>
    <circle r="8" fill="#FF8A50" filter="url(#glow)"/>
  </g>

  <!-- Cyberdeck Accent Glyphs & Sutras -->
  <g fill="#A0A8BA" font-family="'JetBrains Mono', monospace" font-size="12" opacity="0.5" letter-spacing="3">
    <text x="80" y="80">AKRITI OS // CHAMELEON EDITION</text>
    <text x="80" y="105">SUTRA WORKSPACE MATRIX: [VIDYA | NIRMAN | JUGAAD | KOSH]</text>
    <text x="80" y="1010">ROOT ARCHITECTURE: LINUX LITE + XFCE 4.18 // KAVACH SAFEGUARD</text>
    <text x="1560" y="1010">ZRAM SWAP 150% // BWRAP</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 50 100 L 50 50 L 100 50" fill="none" stroke="#E27D60" stroke-width="2" opacity="0.7"/>
  <path d="M 1870 100 L 1870 50 L 1820 50" fill="none" stroke="#E27D60" stroke-width="2" opacity="0.7"/>
  <path d="M 50 980 L 50 1030 L 100 1030" fill="none" stroke="#00A896" stroke-width="2" opacity="0.7"/>
  <path d="M 1870 980 L 1870 1030 L 1820 1030" fill="none" stroke="#00A896" stroke-width="2" opacity="0.7"/>
</svg>
