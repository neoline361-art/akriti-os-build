# ==============================================================================
# Akriti OS (Chameleon) - GRUB2 Hybrid Boot Configuration
# Supports Dual UEFI & Legacy BIOS with Live, Persistent, and Toram Boot Modes
# ==============================================================================

set default=0
set timeout=5

# Cyberdeck Visual Styling
set menu_color_normal=white/black
set menu_color_highlight=light-cyan/blue

# Load video modes
if [ -s $prefix/gfxterm.mod ]; then
    insmod all_video
    insmod gfxterm
    set gfxmode=auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

# 1. Standard Live Session (Default)
menuentry "Akriti OS 1.0 (Bharat Cyberdeck) - Live Session" --class akriti --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper quiet splash fsck.mode=skip ---
    initrd /casper/initrd
}

# 2. Persistent Live Session (Preserves Pothi, Jugaad, and student workspaces on USB)
menuentry "Akriti OS 1.0 - Persistent Mode (Preserves Pothi & Settings)" --class akriti --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper persistent quiet splash fsck.mode=skip ---
    initrd /casper/initrd
}

# 3. Toram Mode (Copies rootfs into RAM for ultra-fast, zero-seek responsive execution)
menuentry "Akriti OS 1.0 - Toram Mode (Load to RAM for Speed, Eject USB)" --class akriti --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper toram quiet splash fsck.mode=skip ---
    initrd /casper/initrd
}

# 4. Safe Graphics Fallback (nomodeset for legacy or troublesome GPUs)
menuentry "Akriti OS 1.0 - Safe Graphics Fallback (nomodeset)" --class akriti --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd /casper/initrd
}

# 5. Direct System Installer (Launches Calamares directly)
menuentry "Akriti OS 1.0 - Direct System Installer (Calamares)" --class akriti --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /casper/vmlinuz boot=casper only-ubiquity quiet splash ---
    initrd /casper/initrd
}

# 6. Hardware & Firmware Utilities
submenu "Advanced & Firmware Options..." {
    menuentry "Check Disc for Defects" {
        linux /casper/vmlinuz boot=casper integrity-check quiet splash ---
        initrd /casper/initrd
    }

    if [ "$grub_platform" = "efi" ]; then
        menuentry "UEFI Firmware Setup" {
            fwsetup
        }
    fi

    menuentry "Reboot System" {
        reboot
    }

    menuentry "Power Off System" {
        halt
    }
}
